# KITTI base config — evaluates lingbot_map on the two KITTI variants:
#   - kitti_504x280  : downsampled KITTI sequences used in our ablations
#   - kitti          : full-resolution KITTI sequences
workspace: /NHNHOME/WORKSPACE/26msit001_A/bispl_lab/youngmin/bench_ws/kitti

datasets:
  - kitti_504x280

methods:
  - base_h16
  - sd_a1_h16
  - base_h32
  - sd_a1_h32
  - base_h64
  - sd_a1_h64
  - base_h128
  - sd_a1_h128
  - base_h256
  - sd_a1_h256

evaluation:
  traj:
    enable: true
    vis: true
  auc:
    enable: false
  depth:
    enable: false
  points:
    enable: false
