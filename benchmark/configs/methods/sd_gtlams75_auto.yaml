# gtlam step 75 -- gtsup's config with the loss weights term_grad_probe says
# equalise GRADIENT contribution (lam_rot 6.29 dir 1.9 mag 0 motion 0.287 depth
# 0.258) instead of A1PC's, which came from loss VALUES.  L_depth held 50% of the
# gradient and sent none of it to camera_head; this is the test of whether that
# is what bought local alignment with global precision.
model: lingbot_map
_checkpoint: /NHNHOME/WORKSPACE/26msit001_A/bispl_lab/youngmin/streaming3d-self-distill/bench_ckpt/sd_gtlam_step75.pt
_device: cuda
_mode: streaming
_use_amp: true
_use_sdpa: true   # flashinfer not installed here
_image_size: 518
_patch_size: 14
_enable_3d_rope: true
_num_scale_frames: 8
_max_frame_num: 1024
_kv_cache_sliding_window: 64
_kv_cache_scale_frames: 8
_keyframe_interval: auto         # auto = 1 if frames<=threshold else ceil(N/threshold); or a fixed int
_auto_keyframe_threshold: 320    # frame-count threshold driving the 'auto' keyframe_interval (streaming mode)
_area_budget: 255000
_align: 14
