# base at K=1 -- generated by experiments/mk_k_configs.sh
# history length (KV-cache sliding window) = 64 frames  [+ 8 scale/anchor frames]
# Generated by benchmark/setup_local/. Edit _checkpoint to point at another run.
model: lingbot_map
# NOTE: no `env:` field -> run.py executes the method in-process.  This machine has
# no conda envs; use the bench venv (.venv-bench) as the interpreter instead.
_checkpoint: /NHNHOME/WORKSPACE/26msit001_A/bispl_lab/youngmin/ckpt/lingbot-map.pt
_device: cuda
_mode: streaming
_use_amp: true
_use_sdpa: true   # no flashinfer installed here -> SDPA backend
_image_size: 518
_patch_size: 14
_enable_3d_rope: true
_num_scale_frames: 8
_max_frame_num: 1024
_kv_cache_sliding_window: 64
_kv_cache_scale_frames: 8
_keyframe_interval: 1
_auto_keyframe_threshold: 320
_reanchor_keyframes: 32
_reanchor_overlap: 32        # shared frames the seam Sim(3) is fitted on
_area_budget: 255000
_align: 14
