# Oxford Spires - K=3, the keyframe interval whose BASELINE matches training.
# Oxford moves 1.711 m/frame vs MCD 0.165, so K=3 gives 5.13 m between cached
# keyframes -- inside the 3.92-5.11 m range the 10 training scenes span at K=28.
workspace: /NHNHOME/WORKSPACE/26msit001_A/bispl_lab/youngmin/bench_ws/oxford

datasets:
  - oxford

methods:
  - base_k3
  - sd_a1_k3
  - sd_a2pcs50_k3
  - sd_a2pcs200_k3
  - sd_a2pcs300_k3
  - sd_a3s50_k3
  - sd_a3s200_k3
  - sd_a3s300_k3
  - sd_a4s50_k3
  - sd_a4s200_k3
  - sd_a4s300_k3
evaluation:
  traj:
    enable: true
    vis: true
  auc:
    enable: true
    vis: true
    aggregation: both
  depth:
    enable: false
  points:
    enable: false
