workspace: /NHNHOME/WORKSPACE/26msit001_A/bispl_lab/youngmin/bench_ws/oxford
datasets:
  - oxford
methods:
  - base_auto
  - sd_gtlams25_auto
  - sd_gtlams50_auto
  - sd_gtlams75_auto
  - sd_gtlams100_auto
  - sd_gtlams150_auto
  - sd_gtlams200_auto
  - sd_gtlams250_auto
  - sd_gtlams275_auto
evaluation:
