# v7f at the same two steps as v6i on oxford_long.  eval-metric-audit.html 05
# attributes the collapse to steps rather than to the long term, but that
# attribution rests on Oxford K=1 (320 frames) alone -- v6i and v7f have never
# been compared at matched steps on the 3,840-frame cell.  This is that cell.
workspace: /NHNHOME/WORKSPACE/26msit001_A/bispl_lab/youngmin/bench_ws/oxford_long
datasets:
  - oxford_long
methods:
  - sd_v7fs300_auto
  - sd_v7fs1200_auto
evaluation:
  traj: {enable: true, vis: false}
  auc: {enable: true, vis: false, aggregation: both}
  depth: {enable: false}
  points: {enable: false}
