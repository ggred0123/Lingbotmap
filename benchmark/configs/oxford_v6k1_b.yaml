# oxford (stride 12, 320 frames) at K=1 for the three runs trained 2026-08-24.
# Split across the two cards after the 01:11 run on kaist-bispl-ym died at
# 01:17 with sd_v6cs300_k1 at 6/10 and the other two unstarted.
# base_k1 is already 10/10 and is carried here only so evaluate scores the
# baseline in the same table; run.py skips it on .complete.json.
workspace: /NHNHOME/WORKSPACE/26msit001_A/bispl_lab/youngmin/bench_ws/oxford
datasets:
  - oxford
methods:
  - sd_v6ds300_k1
  - sd_v6cs300_k1
evaluation:
  traj: {enable: true, vis: false}
  auc: {enable: true, vis: false, aggregation: both}
  depth: {enable: false}
  points: {enable: false}
